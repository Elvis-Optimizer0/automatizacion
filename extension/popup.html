<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola de prompts</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Cola de prompts</h1>
      <div class="status-indicator" id="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Conectando...</span>
      </div>
    </header>

    <section class="section" id="detection-section">
      <div class="section-header">
        <h2>Detección</h2>
      </div>
      <div class="detection-controls">
        <button class="btn btn-primary" id="detect-btn">Detectar</button>
        <button class="btn btn-secondary" id="next-input-btn" hidden>Siguiente caja</button>
        <button class="btn btn-secondary" id="next-submit-btn" hidden>Siguiente botón</button>
        <button class="btn btn-secondary" id="test-input-btn" hidden>Probar caja</button>
        <button class="btn btn-secondary" id="test-submit-btn" hidden>Probar botón</button>
        <button class="btn btn-secondary" id="pick-input-btn" hidden>Elegir yo (caja)</button>
        <button class="btn btn-secondary" id="pick-submit-btn" hidden>Elegir yo (botón)</button>
        <button class="btn btn-secondary" id="forget-btn" hidden>Olvidar esta web</button>
      </div>
      <div class="detection-result" id="detection-result" hidden>
        <div class="detected-item">
          <span class="detected-label">Caja:</span>
          <span class="detected-value" id="detected-input">—</span>
        </div>
        <div class="detected-item">
          <span class="detected-label">Botón:</span>
          <span class="detected-value" id="detected-submit">—</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Prompts</h2>
      </div>
      <textarea id="prompts-textarea" placeholder="Un prompt por línea&#10;o&#10;PROMPT 1: texto&#10;PROMPT 2: texto" spellcheck="false"></textarea>
      <div class="prompts-actions">
        <button class="btn btn-primary" id="add-prompts">+ Añadir</button>
        <button class="btn btn-secondary" id="import-prompts">Importar .txt</button>
        <button class="btn btn-secondary" id="export-state">Exportar estado .json</button>
      </div>
      <input type="file" id="import-file" accept=".txt,.json" hidden>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Control</h2>
      </div>
      <div class="control-buttons">
        <button class="btn btn-success" id="start-btn" disabled>▶ Iniciar</button>
        <button class="btn btn-warning" id="pause-btn" disabled>⏸ Pausar</button>
        <button class="btn btn-danger" id="stop-btn" disabled>⏹ Detener</button>
      </div>
      <div class="control-buttons">
        <button class="btn btn-secondary" id="clear-btn">Limpiar cola</button>
        <button class="btn btn-secondary" id="retry-btn">Reintentar errores</button>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Cola (<span id="done-count">0</span>/<span id="total-count">0</span>)</h2>
      </div>
      <div class="queue-list" id="queue-list"></div>
      <div class="progress-info" id="progress-info" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-text" id="progress-text">Tiempo restante: calculando...</span>
      </div>
    </section>

    <section class="section settings-section">
      <details class="collapsible">
        <summary>Ajustes</summary>
        <div class="settings-grid">
          <label>Pausa entre prompts (s)<input type="number" id="setting-delay" min="1" max="300" step="0.5" value="3"></label>
          <label>Timeout (s)<input type="number" id="setting-timeout" min="10" max="1800" step="5" value="180"></label>
          <label>Reintentos<input type="number" id="setting-retries" min="0" max="10" value="2"></label>
          <label>Resultados por prompt<input type="number" id="setting-images" min="1" max="4" value="1"></label>
          <label class="full-width">Enviar con
            <select id="setting-submit-method">
              <option value="auto">Automático</option>
              <option value="button">Botón</option>
              <option value="enter">Enter</option>
              <option value="ctrl-enter">Ctrl+Enter</option>
            </select>
          </label>
        </div>
      </details>
    </section>

    <section class="section">
      <details class="collapsible" open>
        <summary>Registro</summary>
        <div class="log-container" id="log-container"></div>
      </details>
    </section>

    <section class="section settings-section">
      <details class="collapsible">
        <summary>Diagnóstico</summary>
        <div class="diagnostic-content" id="diagnostic-content"></div>
        <button class="btn btn-secondary" id="copy-diagnostic">Copiar diagnóstico</button>
      </details>
    </section>

    <footer class="popup-footer">
      <span id="extension-version">v2.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
