<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola de prompts</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Cola de prompts</h1>
      <div class="status-indicator" id="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Conectando...</span>
      </div>
    </header>

    <section class="section" id="selectors-section">
      <div class="section-header">
        <h2>Selectores</h2>
      </div>
      <div class="selector-row" data-key="input">
        <div class="selector-info">
          <span class="selector-label">Caja de texto</span>
          <span class="selector-badge" id="badge-input">✖</span>
        </div>
        <div class="selector-actions">
          <button class="btn btn-sm btn-secondary" data-action="test" data-key="input">Probar</button>
        </div>
        <div class="selector-meta" id="meta-input"></div>
      </div>
      <div class="selector-row" data-key="submit">
        <div class="selector-info">
          <span class="selector-label">Botón generar</span>
          <span class="selector-badge" id="badge-submit">✖</span>
        </div>
        <div class="selector-actions">
          <button class="btn btn-sm btn-secondary" data-action="test" data-key="submit">Probar</button>
        </div>
        <div class="selector-meta" id="meta-submit"></div>
      </div>
      <div class="selector-row" data-key="resultImage">
        <div class="selector-info">
          <span class="selector-label">Imagen resultado</span>
          <span class="selector-badge" id="badge-resultImage">✖</span>
        </div>
        <div class="selector-actions">
          <button class="btn btn-sm btn-secondary" data-action="test" data-key="resultImage">Probar</button>
        </div>
        <div class="selector-meta" id="meta-resultImage"></div>
      </div>
      <div class="selector-buttons">
        <button class="btn btn-primary" id="calibrate-btn">Calibrar</button>
        <button class="btn btn-secondary" id="autodetect-btn">Autodetectar</button>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Prompts</h2>
      </div>
      <textarea id="prompts-textarea" placeholder="Un prompt por línea&#10;o&#10;PROMPT 1: texto&#10;PROMPT 2: texto" spellcheck="false"></textarea>
      <div class="prompts-actions">
        <button class="btn btn-primary" id="add-prompts">+ Añadir</button>
        <button class="btn btn-secondary" id="import-prompts">Importar .txt</button>
        <button class="btn btn-secondary" id="export-state">Exportar estado .json</button>
      </div>
      <input type="file" id="import-file" accept=".txt,.json" hidden>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Control</h2>
      </div>
      <div class="control-buttons">
        <button class="btn btn-success" id="start-btn" disabled>▶ Iniciar</button>
        <button class="btn btn-warning" id="pause-btn" disabled>⏸ Pausar</button>
        <button class="btn btn-danger" id="stop-btn" disabled>⏹ Detener</button>
      </div>
      <div class="control-buttons">
        <button class="btn btn-secondary" id="clear-btn">Limpiar cola</button>
        <button class="btn btn-secondary" id="retry-btn">Reintentar errores</button>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Cola (<span id="done-count">0</span>/<span id="total-count">0</span>)</h2>
      </div>
      <div class="queue-list" id="queue-list"></div>
      <div class="progress-info" id="progress-info" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-text" id="progress-text">Tiempo restante: calculando...</span>
      </div>
    </section>

    <section class="section">
      <details class="collapsible" open>
        <summary>Registro</summary>
        <div class="log-container" id="log-container"></div>
      </details>
    </section>

    <section class="section settings-section">
      <details class="collapsible">
        <summary>Diagnóstico</summary>
        <div class="diagnostic-content" id="diagnostic-content"></div>
        <button class="btn btn-secondary" id="copy-diagnostic">Copiar diagnóstico</button>
      </details>
    </section>

    <section class="section settings-section">
      <details class="collapsible">
        <summary>Ajustes</summary>
        <div class="settings-grid">
          <label>Delay entre prompts (ms)<input type="number" id="setting-delay" min="1000" max="60000" step="500" value="3000"></label>
          <label>Timeout por prompt (ms)<input type="number" id="setting-timeout" min="30000" max="600000" step="5000" value="180000"></label>
          <label>Reintentos máximos<input type="number" id="setting-retries" min="0" max="10" value="2"></label>
          <label>Imágenes por prompt<input type="number" id="setting-images" min="1" max="4" value="1"></label>
        </div>
      </details>
    </section>

    <footer class="popup-footer">
      <span id="extension-version">v1.1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
