<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test E: Muchos botones</title>
  <style>
    *{box-sizing:border-box} body{font-family:system-ui;padding:20px;background:#f5f5f5}
    .container{max-width:800px;margin:0 auto;background:white;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    h1{margin-bottom:8px} .hint{color:#666;font-size:.9rem;margin-bottom:16px}
    .prompt-area{width:100%;min-height:120px;padding:12px;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;margin-bottom:16px}
    .btn-group{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
    .btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
    .btn-secondary{background:#e5e7eb;color:#374151}
    .btn-secondary:hover{background:#d1d5db}
    .btn-primary{background:#6366F1;color:white}
    .btn-primary:hover{background:#4f46e5}
    .btn-icon{width:44px;height:44px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn-icon svg{width:20px;height:20px;stroke:white}
    .status{margin-top:12px;padding:8px 12px;border-radius:6px;font-size:13px}
    .status.ready{background:#ecfdf5;color:#065f46}
    .results{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px}
    .result-img{width:180px;height:180px;object-fit:cover;border-radius:8px;border:1px solid #eee;background:#f0f0f0}
  </style>
</head>
<body>
  <div class="container">
    <h1>Test E: Muchos botones</h1>
    <p class="hint">Formulario con botones Adjuntar, Micrófono, Ajustes y Enviar (último, type=submit). Debe elegir Enviar.</p>
    <form id="prompt-form">
      <textarea class="prompt-area" id="prompt-input" placeholder="Tu prompt..."></textarea>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary">Adjuntar</button>
        <button type="button" class="btn btn-icon" aria-label="Micrófono" title="Voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></button>
        <button type="button" class="btn btn-secondary">Ajustes</button>
        <button type="submit" class="btn btn-primary" id="generate-btn">Enviar</button>
      </div>
    </form>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>
  <script>
    const placeholderImages = [
      'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzYzNjZGMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkltYWdlbiAxPC90ZXh0Pjwvc3ZnPg==',
      'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzIyYzU1ZSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkltYWdlbiAyPC90ZXh0Pjwvc3ZnPg==',
      'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iI2Y1OWUwYiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkltYWdlbiAzPC90ZXh0Pjwvc3ZnPg==',
      'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iI2VmNDQ0NCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkltYWdlbiA0PC90ZXh0Pjwvc3ZnPg==',
      'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iIzhjNTRmZiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkltYWdlbiA1PC90ZXh0Pjwvc3ZnPg=='
    ];
    let imgIdx = 0;
    const promptInput = document.getElementById('prompt-input');
    const form = document.getElementById('prompt-form');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim(); if (!prompt) return;
      const submitBtn = document.getElementById('generate-btn');
      submitBtn.disabled = true; submitBtn.style.opacity = '0.6';
      status.textContent = `Generando: "${prompt.slice(0,40)}..."`; status.className = 'status generating';
      await new Promise(r => setTimeout(r, 4000));
      const img = document.createElement('img'); img.src = placeholderImages[imgIdx % placeholderImages.length]; img.className = 'result-img'; img.alt = `Img ${imgIdx+1}`; results.appendChild(img); imgIdx++;
      submitBtn.disabled = false; submitBtn.style.opacity = '1';
      status.textContent = `Imagen ${imgIdx} generada ✓`; status.className = 'status ready';
    });
  </script>
</body>
</html>
