name: Build Video Maker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build executable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videomaker-exe
          path: dist/*.exe
          retention-days: 30

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Package extension
        run: |
          cd extension
          zip -r ../cola-prompts-extension.zip . -x "test/*" "test/**/*" "*.md" "README.md"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: cola-prompts-extension
          path: cola-prompts-extension.zip
          retention-days: 30

  release:
    needs: [app, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: videomaker-exe
          path: dist

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: cola-prompts-extension
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/cola-prompts-extension.zip
          generate_release_notes: true